    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API to keep project active
        run: |
          SUPABASE_URL="https://ukowgpoiidcqfvtnxfwe.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrb3dncG9paWRjcWZ2dG54ZndlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDQ2NTMsImV4cCI6MjA5MjI4MDY1M30.8ulwLJ5i-Dw3djhotGDrFmxsp_V365lKSeUVZEh04KQ"
          
          curl -s -X GET "${SUPABASE_URL}/rest/v1/users?limit=1" \
          -H "apikey: ${ANON_KEY}" \
          -H "Authorization: Bearer ${ANON_KEY}"
          
          echo "✅ Ping sent successfully to prevent pausing."
